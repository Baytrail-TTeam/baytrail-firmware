name: Validate catalog
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/catalog.py validate
      - run: python3 scripts/catalog.py index && git diff --exit-code -- CATALOG.md SHA256SUMS
      - run: sha256sum -c SHA256SUMS
